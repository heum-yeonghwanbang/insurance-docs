<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>4대보험 자료관리</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Header -->
<div class="header">
  <div>
    <h1>4대보험 자료관리</h1>
    <span class="sync-info"><span class="sync-dot" id="syncDot" style="background:#FF9800"></span><span id="syncText">연결 중...</span></span>
  </div>
  <button class="header-btn" id="adminBtn" onclick="toggleAdmin()">&#x1F512; 관리자</button>
</div>

<!-- List Page -->
<div class="page active" id="pageList">
  <div class="tabs" id="tabs"></div>
  <div class="content">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="검색 (제목, 내용, 태그)" oninput="onSearch()">
    </div>
    <button class="write-btn" onclick="openWriteModal()">+ 새 자료 작성</button>
    <div id="docList"></div>
  </div>
</div>

<!-- Analysis Page -->
<div class="page" id="pageGallery">
  <div class="content">
    <div class="gallery-header">
      <h3>자료 분석</h3>
      <span class="count" id="analysisCount">0개 자료</span>
    </div>
    <div class="gallery-filter">
      <button data-filter="all" class="active" onclick="setAnalysisFilter('all')">전체</button>
      <button data-filter="0" onclick="setAnalysisFilter('0')">&#x1F3E6; 국민연금</button>
      <button data-filter="1" onclick="setAnalysisFilter('1')">&#x1F6E1;&#xFE0F; 고용/산재</button>
      <button data-filter="2" onclick="setAnalysisFilter('2')">&#x1F3E5; 건강/요양</button>
      <button data-filter="3" onclick="setAnalysisFilter('3')">&#x1F517; 연계센터등</button>
    </div>
    <div id="analysisList"></div>
  </div>
</div>

<!-- Analysis Modal -->
<div class="modal-overlay" id="analysisModal">
  <div class="modal">
    <h2>분석 작성</h2>
    <label>원본 자료</label>
    <div class="analysis-modal-ref">
      <strong id="analysisModalTitle"></strong><br>
      <span id="analysisModalBody"></span>
    </div>
    <label>분석 내용</label>
    <textarea id="analysisText" placeholder="이 자료에 대한 분석, 메모, 주의사항 등을 작성하세요..." style="height:200px;"></textarea>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeAnalysisModal()">취소</button>
      <button class="btn-save" onclick="saveAnalysis()">저장</button>
    </div>
  </div>
</div>

<!-- Stats Page -->
<div class="page" id="pageStats">
  <div class="content" id="statsContent"></div>
</div>

<!-- Detail Popup -->
<div class="detail-popup" id="detailPopup" onclick="if(event.target===this)closeDetail()">
  <div class="detail-card" id="detailContent"></div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
  <div class="nav-item active" id="navList" onclick="switchPage('list')">
    <span class="nav-icon">&#x1F4CB;</span>자료
  </div>
  <div class="nav-item" id="navGallery" onclick="switchPage('gallery')">
    <span class="nav-icon">&#x1F50D;</span>분석
  </div>
  <div class="nav-item" id="navStats" onclick="switchPage('stats')">
    <span class="nav-icon">&#x1F4CA;</span>통계
  </div>
</div>

<!-- Write/Edit Modal -->
<div class="modal-overlay" id="writeModal">
  <div class="modal">
    <h2 id="modalTitle">새 자료 작성</h2>
    <label>카테고리</label>
    <select id="docCat"></select>
    <label>제목</label>
    <input type="text" id="docTitle" placeholder="자료 제목">
    <label>내용</label>
    <textarea id="docBody" placeholder="자료 내용을 작성하세요..."></textarea>
    <label>태그 (쉼표로 구분)</label>
    <input type="text" id="docTags" placeholder="예: 취득신고, 요율변경, 정산">
    <label>이미지 첨부</label>
    <div class="upload-area">
      <input type="file" id="docImage" accept="image/*" onchange="handleImageUpload()">
      <div id="imagePreview"></div>
    </div>
    <label>파일 첨부</label>
    <div class="upload-area">
      <input type="file" id="docFile" onchange="handleFileUpload()">
      <div class="file-info" id="fileInfo"></div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeWriteModal()">취소</button>
      <button class="btn-save" onclick="saveDoc()">저장</button>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/helpers.js"></script>
<script src="js/api.js"></script>
<script src="js/upload.js"></script>
<script src="js/docs.js"></script>
<script src="js/jar.js"></script>
<script src="js/stats.js"></script>
<script src="js/app.js"></script>
</body>
</html>
